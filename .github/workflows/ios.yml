name: iOS Build v1.0.9

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - run: flutter pub get
      - run: flutter build ipa --no-codesign
      - run: ls -la build/ios/ipa/ || echo "ipa dir not found"
      - uses: actions/upload-artifact@v4
        with:
          name: cash-carry-v1.0.9-ios-unsigned
          path: build/ios/ipa/*.ipa
